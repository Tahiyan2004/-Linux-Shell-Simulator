<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Shell Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <!-- Top Header -->
        <header class="topbar">
            <div>
                <h1>🐧 Linux Shell Simulator</h1>
                <p>
                    Team Explorer • Browser-Based Linux Learning Terminal
                </p>
            </div>
            <div class="buttons">
                <button id="helpButton">Help</button>
                <button id="clearButton">Clear</button>
                <button id="resetButton">Reset</button>
            </div>
        </header>
        <!-- Status Bar -->
        <div class="status-bar">
            <span>🟢 Virtual Linux Environment</span>
            <span>🔒 Safe Mode ON</span>
            <span id="status">Ready</span>
        </div>
        <!-- Terminal -->
        <main id="terminal">
            <div id="output"></div>
            <div class="input-line">
                <span id="prompt"></span>
                <input type="text" id="commandInput" autocomplete="off" spellcheck="false" autofocus>
            </div>
        </main>
        <!-- Footer -->
        <footer>
            Try:
            <b>help</b>
            •
            <b>tutorial</b>
            •
            <b>mkdir Project</b>
            •
            Use
            <b>↑ ↓</b>
            for command history
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
